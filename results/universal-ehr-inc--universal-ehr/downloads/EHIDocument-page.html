            <textarea id="FreeTextBox1" name="FreeTextBox1" cols="50" rows="10"><h1 style="text-align: center;"><br></h1><h1 style="text-align: center;"><b><font face="Tahoma">170.315(b)(10) Electronic Health Information export</font></b></h1><div><font size="4">We use EMR Direct Interoperability Engine as our authorization server. For more information, please visit this&nbsp;<a href="/EMR/index2022.html">link</a>.&nbsp;</font></div><div><font size="4"><br></font></div><div><font size="4">This EHI Export is intended for users including all staff and providers who are at least in 1 of the following roles:&nbsp; Admin, SystemAdmin, Ournurses, OurDoctor, or Lead.</font></div><div><br></div><div><font size="5">1.<span style="white-space: pre;">	</span>Single Patient Export:</font></div><div><font size="5"><br></font></div><div><span style="white-space: pre;"><span style="white-space: pre;">	</span>1a.<span style="font-size: large; white-space: pre;">	</span><font size="4">Login to UniversalEHR using your username and password.</font></span><img src="/images/ehi/logininfo.jpg" style="text-align: center; width: 80%;"><span style="text-align: center; white-space: pre;"><font size="4">	</font></span></div><div><font size="4"><span style="white-space:pre">	</span>1b.<span style="white-space:pre">	</span>Click on "EHI EXPORT" link.<span style="white-space:pre">	</span></font></div><div><br></div><div style="text-align: center; "><span style="white-space: pre;">					</span><img src="/images/ehi/exportlink.jpg"></div><div><br></div><div><font size="4"><span style="white-space: pre;">	</span>1c.<span style="white-space: pre;">	</span>Click on check box to select patient's name.</font></div><div><font size="5"><br></font></div><div style="text-align: center; "><font size="5"><span style="white-space:pre">	</span></font><img style="width:70%;" src="http://www.universalehr.com/images/ehi/checkpatientname.jpg"></div><div><span style="font-size: large;"><br></span></div><div><span style="font-size: large;"><span style="white-space:pre">	</span>1d.</span><span style="font-size: large; white-space: pre;">	</span><span style="font-size: large;">Click on "Start Export" button</span></div><div><span style="font-size: large;"><br></span></div><div></div><div style="text-align: center; "><font size="5"><span style="white-space:pre">		</span></font><img style="width:70%;" src="http://www.universalehr.com/images/ehi/startexportbutton.jpg"></div><div><span style="white-space: pre;"><font size="4">		</font></span></div><div><font size="4"><span style="white-space: pre;">	</span>1e.<span style="white-space: pre;">	</span>You'll see a message, "Please wait" appears at the bottom indicate that export is being processed.</font></div><div><font size="4"><br></font></div><div style="text-align: center; "><font size="5"><span style="white-space:pre">	</span><span style="white-space:pre">	</span></font><img src="http://www.universalehr.com/images/ehi/pleasewaitscreen.jpg" style="width: 70%;"></div><div style="text-align: left;">&nbsp;<font size="4">&nbsp;</font></div><div><font size="4"><span style="white-space:pre">	</span>1f:<span style="white-space: pre;">	</span>Click on "Download all files as a Zip file" button to export all files.</font></div><div><font size="4">&nbsp;</font></div><div style="text-align: center; "><span style="white-space:pre">	</span><img src="http://www.universalehr.com/images/ehi/downloadButton.jpg"></div><div><font size="4">&nbsp;</font></div><div><font size="4"><span style="white-space: pre;">		</span>Data is exported in ndjson format( newline delimited JSON).</font></div><div></div><div></div><div><span style="white-space: pre;"><font size="4">	</font><font size="5">	</font></span></div><div style="text-align: center; "><font size="5"><span style="white-space:pre">		</span></font><img style="width:70%;" src="http://www.universalehr.com/images/ehi/ndjsonformat.png"></div><div><font size="5"><br></font></div><div style="text-align: center; "><font size="5"><span style="white-space:pre">		</span></font><img src="http://www.universalehr.com/images/ehi/zipFile.png"></div><div><font size="5"><span style="white-space:pre">		</span></font></div><div><font size="5">2.<span style="white-space: pre;">	</span>Multiple Patient Export:<span style="white-space: pre;">	</span></font></div><div><span style="white-space:pre">	</span>&nbsp;&nbsp;</div><div><font size="4"><span style="white-space: pre;">	</span>1a:<span style="white-space: pre;">	</span>Repeat Step 1 &amp; 2 in Single Patient Export</font></div><div><font size="4"><span style="white-space:pre">	</span>1b:<span style="white-space:pre">	</span>Select specific or all patients in the list.</font></div><div style="text-align: center; "><span style="white-space:pre">		</span><img style="width:70%;" src="http://www.universalehr.com/images/ehi/selectMultiplePatients.jpg"></div><div><font size="4"><span style="white-space:pre">	</span>1c: Click on "Start Export" button.</font></div><div><font size="4"><br></font></div><div><span style="white-space:pre">				</span><img src="http://www.universalehr.com/images/ehi/StartExportButtonMultiple.jpg"></div><div><br></div><div><br></div><div><span style="white-space:pre">	</span></div><div><span style="white-space:pre">	</span><font size="4">1d: Click Download button to download as Zip file.</font></div><div><span style="white-space:pre">	</span></div><div><br></div><div style="text-align: center; "><span style="white-space:pre">	</span><img src="http://www.universalehr.com/images/ehi/folderDescriptions.JPG"></div><div><br></div><div><br></div><div><br></div><div><font size="4"><span style="white-space:pre">	</span>Each folder is named by Patient ID.</font></div><div><font size="4"><span style="white-space:pre">	</span>Inside each folder contains all Patient's documents such as PDF documents, image files, etc.</font></div><div><br></div><div style="text-align: center; "><br></div></textarea>
