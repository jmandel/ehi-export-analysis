<!DOCTYPE html>
<html lang="en">
    <head>
        <title>athenahealth Document Portal</title>
        <meta name="meta-cdn-config:_default" content="https://cdn.nimbus.athena.io/"/>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <meta name="theme-color" content="#000000"/>
        <link rel="icon" href="/athena.png"/>
        <script
            type="text/javascript"
            src="https://cdn.nimbus.athena.io/athena-require/1.2.0/athena-require.js"
        ></script>
        <script type="text/javascript" src="https://cdn.nimbus.athena.io/nimbus-bundle-loader/1.5.0/nimbus-bundle-loader.js"></script>
        <script type="text/javascript">
            
    window.onload = function () {
        require(["@athena/nimbus-bundle-loader"], function(nimbusBundleLoader) {
          const bundlePromise = nimbusBundleLoader.load({
          cdnName: "nimbus",
          packageName: "document-portal-ui",
          useLaunchDarkly: true
        });
      bundlePromise.then(function(app) {
            const appParams = {
              basePath: "/"
            };  // you can add launch parameters as an argument to the start function.
            app.start(document.getElementById("root"), appParams);
          });
        });
      };      

        </script>
        <meta name="robots" content="index, follow"/>
        <link rel="canonical" href="https://docs.athenahealth.com"/>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <script type="text/javascript" src="https://assets.adobedtm.com/af863b429082/1d61292c27c0/launch-0f6af11dce2b.min.js"></script>
    </head>
    <body>
        <main id="root" class="portal-main-section"></main>
    </body>
</html>
