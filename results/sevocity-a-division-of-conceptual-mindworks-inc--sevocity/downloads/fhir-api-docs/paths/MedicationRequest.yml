get:
  tags:
  - MedicationRequest
  summary: 'search-type: Search for MedicationRequest instances'
  description: This is a search type
  parameters:
  - $ref: ../components/parameters/PatientParam.yml
  - name: intent
    in: query
    description: Returns prescriptions with different intents
    schema:
      type: string
  - name: status
    in: query
    description: Status of the prescription
    schema:
      type: string
  responses:
    '200':
      description: Success
      content:
        application/fhir+json:
          schema:
            $ref: ../components/schemas/SEARCHMEDICATIONREQUEST.yml
  servers:
  - url: https://api.sevocity.com/api/sevocity/v1/{Organization ID}
    description: Sevocity FHIR api - Providers
  - url: https://api.sevocity.com/api/patients/v1/{Organization ID}
    description: Sevocity FHIR api - Patients
