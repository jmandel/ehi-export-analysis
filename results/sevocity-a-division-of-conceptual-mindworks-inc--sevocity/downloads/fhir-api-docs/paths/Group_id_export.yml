get:
  tags:
  - Group
  parameters:
  - name: _outputFormat
    in: query
    required: false
    schema:
      type: string
  - name: _type
    in: query
    required: false
    schema:
      type: string
  - name: _since
    in: query
    required: false
    schema:
      type: string
  - name: _typeFilter
    in: query
    required: false
    schema:
      type: string
  - name: _mdm
    in: query
    required: false
    schema:
      type: string
  - $ref: ../components/parameters/IdParam.yml
  responses:
    '200':
      description: Success
      content:
        application/fhir+json:
          schema:
            $ref: ../components/schemas/FHIR-JSON-RESOURCE.yml
  servers:
  - url: https://api.sevocity.com/api/sevocity/v1/{Organization ID}
    description: Sevocity FHIR api - Providers
  - url: https://api.sevocity.com/api/patients/v1/{Organization ID}
    description: Sevocity FHIR api - Patients
