type: object
description: An Immunization Search
properties:
  entry:
    type: array
    items:
      type: object
      properties:
        fullUrl:
          type: string
          example: https://api.sevocity.com/api/sevocity/v1/Immunization/992
        resource:
          $ref: ./READIMMUNIZATION.yml
  id:
    type: string
    example: 9c15c5ff-7267-41e4-a937-08928b71d8c0
  link:
    type: array
    items:
      type: object
      properties:
        relation:
          type: string
          example: self
        url:
          type: string
          example: https://api.sevocity.com/api/sevocity/v1/Immunization?patient=GE3DKMBZHA3TIMBSGEYTSZ3GGE4TSNJNGA3S2MJV
  meta:
    type: object
    properties:
      lastUpdated:
        type: string
        example: '2022-12-13T15:26:06.981+00:00'
  resourceType:
    type: string
    example: Bundle
  total:
    type: integer
    format: int32
    example: 1
  type:
    type: string
    example: searchset
