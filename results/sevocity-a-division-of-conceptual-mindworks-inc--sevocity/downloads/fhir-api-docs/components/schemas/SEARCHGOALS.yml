type: object
description: A Goals Search
properties:
  entry:
    type: array
    items:
      type: object
      properties:
        fullUrl:
          type: string
          example: https://api.sevocity.com/api/sevocity/v1/Goal/13125
        resource:
          $ref: ./READGOAL.yml
  id:
    type: string
    example: 75f7648b-90ea-4be3-8b83-d32a051b2afa
  link:
    type: array
    items:
      type: object
      properties:
        relation:
          type: string
          example: self
        url:
          type: string
          example: https://api.sevocity.com/api/sevocity/v1/Goal?patient=GE3DKMBZHA3TIMBSGEYTSZ3GGE4TSNJNGA3S2MJV
  meta:
    type: object
    properties:
      lastUpdated:
        type: string
        example: '2022-12-13T15:14:43.190+00:00'
  resourceType:
    type: string
    example: Bundle
  total:
    type: integer
    format: int32
    example: 1
  type:
    type: string
    example: searchset
