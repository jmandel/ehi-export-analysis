type: object
description: A Device Read
properties:
  distinctIdentifier:
    type: string
    example: (01)10884521062856(11)141231(17)250707(10)A213B1(21)1234
  expirationDate:
    type: string
    format: date-time
    example: '2025-07-07T00:00:00+00:00'
  id:
    type: string
    example: 260
  lotNumber:
    type: string
    example: A213B1
  manufactureDate:
    type: string
    format: date-time
    example: '2014-12-31T00:00:00+00:00'
  meta:
    type: object
    properties:
      versionId:
        type: string
        example: 1
  patient:
    type: object
    properties:
      display:
        type: string
        example: GE3DKMBZHA3TIMBSGEYTSZ3GGE4TSNJNGA3S2MJV
      reference:
        type: string
        example: Patient/GE3DKMBZHA3TIMBSGEYTSZ3GGE4TSNJNGA3S2MJV
  resourceType:
    type: string
    example: Device
  serialNumber:
    type: string
    example: 1234
  type:
    type: object
    properties:
      text:
        type: string
        example: Polyester suture non-bioabsorbable multifilament
  udiCarrier:
    type: array
    items:
      type: object
      properties:
        carrierHRF:
          type: string
          example: (01)10884521062856(11)141231(17)250707(10)A213B1(21)1234
        deviceIdentifier:
          type: string
          example: 10884521062856
