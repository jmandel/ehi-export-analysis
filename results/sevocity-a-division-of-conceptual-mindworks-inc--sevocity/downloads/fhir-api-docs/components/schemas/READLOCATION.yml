type: object
description: A Location Read
properties:
  address:
    type: object
    properties:
      city:
        type: string
        example: San Antonio
      line:
        type: array
        items:
          type: string
          example: 9830 Colonnade Blvd
      postalCode:
        type: string
        example: 78230
      state:
        type: string
        example: TX
  id:
    type: string
    example: 6f0c7e3c8ba75747d4f584b553305772c43b2688
  managingOrganization:
    type: object
    properties:
      reference:
        type: string
        example: Organization/2107370777
  name:
    type: string
    example: CMI Clinic
  resourceType:
    type: string
    example: Location
  status:
    type: string
    example: active
  telecom:
    type: array
    items:
      type: object
      properties:
        system:
          type: string
          example: phone
        use:
          type: string
          example: work
        value:
          type: string
          example: 2107370777
