type: object
description: A Practitioner Search
properties:
  entry:
    type: array
    items:
      type: object
      properties:
        fullUrl:
          type: string
          example: https://api.sevocity.com/api/sevocity/v1/Practitioner/dtc_scheduler
        resource:
          $ref: ./ReadPractitioner.yml
  id:
    type: string
    example: 15b6b767-baa7-4442-9a86-4b65aeb358b6
  link:
    type: array
    items:
      type: object
      properties:
        relation:
          type: string
          example: self
        url:
          type: string
          example: https://api.sevocity.com/api/sevocity/v1/Practitioner?name=schedule
  meta:
    type: object
    properties:
      lastUpdated:
        type: string
        example: '2022-12-13T18:24:39.816+00:00'
  resourceType:
    type: string
    example: Bundle
  total:
    type: integer
    format: int32
    example: 1
  type:
    type: string
    example: searchset
