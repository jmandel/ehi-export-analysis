type: object
description: An Observation Search
properties:
  entry:
    type: array
    items:
      type: object
      properties:
        fullUrl:
          type: string
          example: https://api.sevocity.com/api/sevocity/v1/Observation/labresult.13245
        resource:
          $ref: ./READOBSERVATION.yml
  id:
    type: string
    example: d7f215be-8099-42b3-847d-68ab896d4459
  link:
    type: array
    items:
      type: object
      properties:
        relation:
          type: string
          example: self
        url:
          type: string
          example: https://api.sevocity.com/api/sevocity/v1/Observation?category=laboratory&patient=GE3DKNZRGE4TGNRSHEZDKZ3GGIYDEMBNGA3S2MJV
  meta:
    type: object
    properties:
      lastUpdated:
        type: string
        example: '2022-12-15T14:55:06.497+00:00'
  resourceType:
    type: string
    example: Bundle
  total:
    type: integer
    format: int32
    example: 1
  type:
    type: string
    example: searchset
