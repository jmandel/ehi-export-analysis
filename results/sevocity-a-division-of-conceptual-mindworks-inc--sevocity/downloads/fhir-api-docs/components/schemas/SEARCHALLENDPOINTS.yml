type: object
description: Get All Endpoints
properties:
  entry:
    type: array
    items:
      type: object
      properties:
        fullUrl:
          type: string
          example: https://api.sevocity.com/api/sevocity/v1/Endpoint/2107370777
        resource:
          type: object
          properties:
            address:
              type: string
              example: https://api.sevocity.com/api/patients/v1
            connectionType:
              type: object
              properties:
                code:
                  type: string
                  example: hl7-fhir-rest
                display:
                  type: string
                  example: HL7 FHIR
                system:
                  type: string
                  example: http://terminology.hl7.org/CodeSystem/endpoint-connection-type
            id:
              type: string
              example: 2107370777
            name:
              type: string
              example: CMI Clinic
            payloadType:
              type: array
              items:
                type: object
                properties:
                  coding:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: urn:ihe:pcc:xphr:2007
                        display:
                          type: string
                          example: Personal Health Records
                        system:
                          type: string
                          example: http://terminology.hl7.org/CodeSystem/endpoint-payload-type
            resourceType:
              type: string
              example: Endpoint
            status:
              type: string
              example: active
  id:
    type: string
    example: b12da5c6-6d1b-4eae-8292-fc27df6f23cc
  link:
    type: array
    items:
      type: object
      properties:
        relation:
          type: string
          example: self
        url:
          type: string
          example: https://api.sevocity.com/api/sevocity/v1/Endpoint
  meta:
    type: object
    properties:
      lastUpdated:
        type: string
        example: '2022-12-21T22:19:08.606+00:00'
  resourceType:
    type: string
    example: Bundle
  total:
    type: integer
    format: int32
    example: 1
  type:
    type: string
    example: searchset
