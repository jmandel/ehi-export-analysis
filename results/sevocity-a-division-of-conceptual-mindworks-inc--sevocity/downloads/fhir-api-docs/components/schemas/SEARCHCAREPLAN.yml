type: object
description: A CarePlan Search
properties:
  entry:
    type: array
    items:
      type: object
      properties:
        fullUrl:
          type: string
          example: https://api.sevocity.com/api/sevocity/v1/CarePlan/12880
        resource:
          $ref: ./READCAREPLAN.yml
  id:
    type: string
    example: 4945568b-6262-4985-b7df-c60298122e4a
  link:
    type: array
    items:
      type: object
      properties:
        relation:
          type: string
          example: self
        url:
          type: string
          example: https://api.sevocity.com/api/sevocity/v1/CarePlan?category=plan&patient=GE3DKMBZHA3TIMBSGEYTSZ3GGE4TSNJNGA3S2MJV
  meta:
    type: object
    properties:
      lastUpdated:
        type: string
        example: '2022-12-12T17:23:25.465+00:00'
  resourceType:
    type: string
    example: Bundle
  total:
    type: integer
    format: int32
    example: 1
  type:
    type: string
    example: searchset
