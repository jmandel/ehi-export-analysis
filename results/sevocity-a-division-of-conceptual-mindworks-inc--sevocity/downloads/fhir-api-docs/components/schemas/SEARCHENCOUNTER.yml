type: object
description: An Encounter Search
properties:
  entry:
    type: array
    items:
      type: object
      properties:
        fullUrl:
          type: string
          example: https://api.sevocity.com/api/sevocity/v1/Encounter/GIYTANZTG4YDONZXFUYTMNJQHE4DONRZGI3DQMRNMZRGY2LTONSXI5A
        resource:
          $ref: ./READENCOUNTER.yml
  id:
    type: string
    example: a68e18bb-598f-40ae-93ea-be671a5dd09b
  link:
    type: array
    items:
      type: object
      properties:
        relation:
          type: string
          example: self
        url:
          type: string
          example: https://api.sevocity.com/api/sevocity/v1/Encounter?patient=GE3DKMBZHA3TIMBSGEYTSZ3GGE4TSNJNGA3S2MJV
  meta:
    type: object
    properties:
      lastUpdated:
        type: string
        example: '2022-12-13T04:43:32.700+00:00'
  resourceType:
    type: string
    example: Bundle
  total:
    type: integer
    format: int32
    example: 1
  type:
    type: string
    example: searchset
