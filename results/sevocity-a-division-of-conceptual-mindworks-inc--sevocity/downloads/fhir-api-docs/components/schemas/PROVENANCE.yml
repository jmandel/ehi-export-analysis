type: object
description: A Provenance Read
properties:
  agent:
    type: array
    items:
      type: object
      properties:
        onBehalfOf:
          type: object
          properties:
            reference:
              type: string
              example: Organization/2107370777
        type:
          type: object
          properties:
            coding:
              type: array
              items:
                type: object
                properties:
                  code:
                    type: string
                    example: author
                  system:
                    type: string
                    example: http://terminology.hl7.org/CodeSystem/provenance-participant-type
        who:
          type: object
          properties:
            reference:
              type: string
              example: Practitioner/jblissett
  id:
    type: string
    example: Patient.GE3DKMBZHA3TIMBSGEYTSZ3GGE4TSNJNGA3S2MJV
  meta:
    type: object
    properties:
      versionId:
        type: string
        example: 1
  recorded:
    type: string
    example: '2022-11-28T00:00:00.000+00:00'
  resourceType:
    type: string
    example: Provenance
  target:
    type: array
    items:
      type: object
      properties:
        reference:
          type: string
          example: Patient/GE3DKMBZHA3TIMBSGEYTSZ3GGE4TSNJNGA3S2MJV
