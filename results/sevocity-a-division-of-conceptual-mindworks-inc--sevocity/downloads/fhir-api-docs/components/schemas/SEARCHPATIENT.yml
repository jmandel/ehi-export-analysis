type: object
description: A Patient Search
properties:
  entry:
    type: array
    items:
      type: object
      properties:
        fullUrl:
          type: string
          example: https://api.sevocity.com/api/sevocity/v1/Patient/GE3DKNZRGE4TGNRSHEZDKZ3GGIYDEMBNGA3S2MJV
        resource:
          $ref: ./READPATIENT.yml
  id:
    type: string
    example: 93e3778d-a9dd-45e7-8951-e07632d50f38
  link:
    type: array
    items:
      type: object
      properties:
        relation:
          type: string
          example: self
        url:
          type: string
          example: https://api.sevocity.com/api/sevocity/v1/Patient?identifier=10492
  meta:
    type: object
    properties:
      lastUpdated:
        type: string
        example: '2022-12-13T16:31:22.575+00:00'
  resourceType:
    type: string
    example: Bundle
  total:
    type: integer
    format: int32
    example: 1
  type:
    type: string
    example: searchset
