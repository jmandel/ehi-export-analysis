type: object
description: A CareTeam Search
properties:
  entry:
    type: array
    items:
      type: object
      properties:
        fullUrl:
          type: string
          example: https://api.sevocity.com/api/sevocity/v1/CareTeam/GE3DKMBZHA3TIMBSGEYTSZ3GGE4TSNJNGA3S2MJV.ACTIVE
        resource:
          $ref: ./READCARETEAM.yml
  id:
    type: string
    example: bd389876-cf35-41cc-b194-fa71d62db982
  link:
    type: array
    items:
      type: object
      properties:
        relation:
          type: string
          example: self
        url:
          type: string
          example: https://api.sevocity.com/api/sevocity/v1/CareTeam?patient=Patient%2FGE3DKMBZHA3TIMBSGEYTSZ3GGE4TSNJNGA3S2MJV&status=active
  meta:
    type: object
    properties:
      lastUpdated:
        type: string
        example: '2022-12-12T17:41:34.736+00:00'
  resourceType:
    type: string
    example: Bundle
  total:
    type: integer
    format: int32
    example: 1
  type:
    type: string
    example: searchset
