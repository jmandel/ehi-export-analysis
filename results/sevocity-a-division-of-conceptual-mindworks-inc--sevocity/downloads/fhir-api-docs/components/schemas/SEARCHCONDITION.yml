type: object
description: A Condition Search
properties:
  entry:
    type: array
    items:
      type: object
      properties:
        fullUrl:
          type: string
          example: https://api.sevocity.com/api/sevocity/v1/Condition/17711
        resource:
          $ref: ./READCONDITION.yml
  id:
    type: string
    example: 3cad5702-c21e-4217-b2bb-3378ba871f49
  link:
    type: array
    items:
      type: object
      properties:
        relation:
          type: string
          example: self
        url:
          type: string
          example: https://api.sevocity.com/api/sevocity/v1/Condition?patient=GE3DKMBZHA3TIMBSGEYTSZ3GGE4TSNJNGA3S2MJV
  meta:
    type: object
    properties:
      lastUpdated:
        type: string
        example: '2022-12-12T17:52:17.404+00:00'
  resourceType:
    type: string
    example: Bundle
  total:
    type: integer
    format: int32
    example: 7
  type:
    type: string
    example: searchset
