<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 880" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fafbfc"/>
      <stop offset="100%" stop-color="#f0f2f5"/>
    </linearGradient>
    <filter id="sh" x="-3%" y="-3%" width="106%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000010"/>
    </filter>
  </defs>

  <rect width="780" height="880" rx="12" fill="url(#bg)"/>

  <!-- Title -->
  <text x="350" y="36" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a" letter-spacing="-0.3">EHI Export Analysis Pipeline</text>
  <text x="350" y="54" text-anchor="middle" font-size="11" fill="#64748b">How do certified EHR vendors handle patient data export?</text>

  <!-- ═══════ FUNNEL TOP: DATA SOURCE ═══════ -->
  <polygon points="130,82 570,82 530,132 170,132" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="350" y="103" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">ONC CHPL Registry</text>
  <text x="350" y="118" text-anchor="middle" font-size="10" fill="#3b82f6">696 certified EHR products</text>

  <!-- Arrow -->
  <line x1="350" y1="132" x2="350" y2="152" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ═══════ FILTER & GROUP ═══════ -->
  <polygon points="170,156 530,156 500,206 200,206" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="350" y="175" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">Filter: CPOE + FHIR API</text>
  <text x="350" y="191" text-anchor="middle" font-size="9.5" fill="#15803d">265 products with (a)(1)–(a)(3) + (g)(10) certification</text>

  <!-- Merge/split annotation -->
  <rect x="530" y="158" width="148" height="40" rx="6" fill="#fefce8" stroke="#fde68a"/>
  <text x="604" y="174" text-anchor="middle" font-size="9" fill="#92400e">✏️ Human-informed,</text>
  <text x="604" y="186" text-anchor="middle" font-size="9" fill="#92400e">AI-proposed</text>
  <text x="604" y="197" text-anchor="middle" font-size="8.5" fill="#a16207">merge &amp; split decisions</text>
  <polyline points="530,178 510,178 510,181 502,181" fill="none" stroke="#d97706" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-amber)"/>

  <!-- Arrow -->
  <line x1="350" y1="206" x2="350" y2="226" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ═══════ DEDUPLICATE & GROUP ═══════ -->
  <polygon points="200,230 500,230 480,272 220,272" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="350" y="248" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">Deduplicate &amp; Group</text>
  <text x="350" y="263" text-anchor="middle" font-size="9" fill="#64748b">265 products → 217 product families by vendor &amp; EHI doc URL</text>

  <!-- Arrow -->
  <line x1="350" y1="272" x2="350" y2="298" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ═══════ STAGE: COLLECTION ═══════ -->
  <rect x="60" y="302" width="580" height="155" rx="10" fill="white" stroke="#e2e8f0" filter="url(#sh)"/>
  <rect x="60" y="302" width="580" height="30" rx="10" fill="#7c3aed"/>
  <rect x="60" y="322" width="580" height="10" fill="#7c3aed"/>
  <text x="80" y="322" font-size="12" font-weight="600" fill="white">Collection Loop</text>
  <text x="620" y="322" text-anchor="end" font-size="9" fill="#e9d5ff">LLM agent per family</text>

  <!-- Research -->
  <rect x="85" y="345" width="250" height="50" rx="8" fill="#faf5ff" stroke="#ddd6fe"/>
  <text x="100" y="364" font-size="11" font-weight="600" fill="#6b21a8">🔍 Research</text>
  <text x="100" y="380" font-size="9.5" fill="#7c3aed">Web search: what data does</text>
  <text x="100" y="391" font-size="9.5" fill="#7c3aed">this product store?</text>

  <!-- Arrow -->
  <line x1="335" y1="370" x2="360" y2="370" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Download -->
  <rect x="365" y="345" width="255" height="50" rx="8" fill="#faf5ff" stroke="#ddd6fe"/>
  <text x="380" y="364" font-size="11" font-weight="600" fill="#6b21a8">📥 Download</text>
  <text x="380" y="380" font-size="9.5" fill="#7c3aed">Navigate vendor URL, archive</text>
  <text x="380" y="391" font-size="9.5" fill="#7c3aed">all export documentation</text>

  <!-- Output label -->
  <rect x="85" y="410" width="535" height="32" rx="6" fill="#faf5ff" stroke="#e9d5ff" stroke-dasharray="4,3"/>
  <text x="350" y="430" text-anchor="middle" font-size="10" fill="#6b21a8">Per-family archive: research notes · PDFs · data dictionaries · HTML pages · schemas</text>

  <!-- ═══════ FIXUP FEEDBACK LOOP ═══════ -->
  <!-- GitHub Issues trigger -->
  <rect x="650" y="330" width="110" height="40" rx="6" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="705" y="348" text-anchor="middle" font-size="9.5" font-weight="600" fill="#c2410c">GitHub Issues</text>
  <text x="705" y="361" text-anchor="middle" font-size="8.5" fill="#ea580c">flag problems</text>

  <!-- Arrow: Issues → Fixups -->
  <line x1="705" y1="370" x2="705" y2="459" stroke="#c2410c" stroke-width="1.2" marker-end="url(#arrow-amber)"/>

  <!-- Fixup box (centered in gap between Collection y457 and Analysis y501) -->
  <rect x="650" y="462" width="110" height="34" rx="6" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="705" y="477" text-anchor="middle" font-size="9.5" font-weight="600" fill="#c2410c">🔧 Fixups</text>
  <text x="705" y="489" text-anchor="middle" font-size="8.5" fill="#ea580c">re-collect / re-analyze</text>

  <!-- Arrow: fixup → up into Collection (L-shaped) -->
  <polyline points="650,471 643,471 643,457" fill="none" stroke="#c2410c" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrow-amber)"/>
  <!-- Arrow: fixup → down into Analysis (L-shaped) -->
  <polyline points="650,487 643,487 643,501" fill="none" stroke="#c2410c" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrow-amber)"/>

  <!-- Arrow -->
  <line x1="350" y1="457" x2="350" y2="497" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ═══════ STAGE: ANALYSIS ═══════ -->
  <rect x="60" y="501" width="580" height="115" rx="10" fill="white" stroke="#e2e8f0" filter="url(#sh)"/>
  <rect x="60" y="501" width="580" height="30" rx="10" fill="#059669"/>
  <rect x="60" y="521" width="580" height="10" fill="#059669"/>
  <text x="80" y="521" font-size="12" font-weight="600" fill="white">Deep Analysis</text>
  <text x="620" y="521" text-anchor="end" font-size="9" fill="#d1fae5">LLM agent per family</text>

  <rect x="85" y="543" width="240" height="58" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="100" y="562" font-size="10.5" font-weight="600" fill="#065f46">📝 Narrative Assessment</text>
  <text x="100" y="577" font-size="9.5" fill="#047857">Read all artifacts, grade export</text>
  <text x="100" y="590" font-size="9.5" fill="#047857">completeness against EHI scope</text>

  <rect x="345" y="543" width="275" height="58" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="360" y="562" font-size="10.5" font-weight="600" fill="#065f46">📊 Structured Extraction</text>
  <text x="360" y="577" font-size="9.5" fill="#047857">Entity inventories, field counts,</text>
  <text x="360" y="590" font-size="9.5" fill="#047857">custom parsing scripts</text>

  <!-- Arrow -->
  <line x1="350" y1="616" x2="350" y2="650" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ═══════ STAGE: SUMMARY ═══════ -->
  <rect x="110" y="654" width="480" height="70" rx="10" fill="white" stroke="#e2e8f0" filter="url(#sh)"/>
  <rect x="110" y="654" width="480" height="30" rx="10" fill="#1e293b"/>
  <rect x="110" y="674" width="480" height="10" fill="#1e293b"/>
  <text x="130" y="674" font-size="12" font-weight="600" fill="white">Summary Extraction</text>

  <text x="350" y="704" text-anchor="middle" font-size="10" fill="#334155">LLM distills each analysis → structured JSON</text>
  <text x="350" y="717" text-anchor="middle" font-size="9" fill="#64748b">Grade · coverage level · export formats · field counts · billing inclusion</text>

  <!-- Arrow -->
  <line x1="350" y1="724" x2="350" y2="758" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ═══════ STAGE: DASHBOARD ═══════ -->
  <rect x="60" y="762" width="580" height="100" rx="10" fill="white" stroke="#93c5fd" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="60" y="762" width="580" height="30" rx="10" fill="#0284c7"/>
  <rect x="60" y="782" width="580" height="10" fill="#0284c7"/>
  <text x="80" y="782" font-size="12" font-weight="600" fill="white">Public Dashboard</text>
  <text x="620" y="782" text-anchor="end" font-size="9" fill="#e0f2fe">GitHub Pages</text>

  <g transform="translate(85, 802)">
    <rect x="0" y="0" width="125" height="46" rx="7" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="62" y="18" text-anchor="middle" font-size="10" font-weight="600" fill="#1e40af">Vendor Grades</text>
    <text x="62" y="32" text-anchor="middle" font-size="9" fill="#2563eb">Sortable list</text>
    <text x="62" y="43" text-anchor="middle" font-size="9" fill="#2563eb">A → F</text>
  </g>

  <g transform="translate(230, 802)">
    <rect x="0" y="0" width="125" height="46" rx="7" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="62" y="18" text-anchor="middle" font-size="10" font-weight="600" fill="#1e40af">Full Analysis</text>
    <text x="62" y="32" text-anchor="middle" font-size="9" fill="#2563eb">Inline narrative</text>
    <text x="62" y="43" text-anchor="middle" font-size="9" fill="#2563eb">per vendor</text>
  </g>

  <g transform="translate(375, 802)">
    <rect x="0" y="0" width="125" height="46" rx="7" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="62" y="18" text-anchor="middle" font-size="10" font-weight="600" fill="#1e40af">File Archive</text>
    <text x="62" y="32" text-anchor="middle" font-size="9" fill="#2563eb">All source docs</text>
    <text x="62" y="43" text-anchor="middle" font-size="9" fill="#2563eb">+ analysis data</text>
  </g>

  <g transform="translate(520, 802)">
    <rect x="0" y="0" width="100" height="46" rx="7" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="50" y="18" text-anchor="middle" font-size="10" font-weight="600" fill="#1e40af">Charts</text>
    <text x="50" y="32" text-anchor="middle" font-size="9" fill="#2563eb">Grade</text>
    <text x="50" y="43" text-anchor="middle" font-size="9" fill="#2563eb">distribution</text>
  </g>
</svg>
