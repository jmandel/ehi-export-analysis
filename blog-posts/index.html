<!DOCTYPE html>
<html><head>

<style>
body { max-width: 720px; margin: 40px auto; padding: 0 20px; font-family: Georgia, serif; line-height: 1.7; color: #222; }
h1 { font-size: 1.8em; line-height: 1.2; margin-bottom: 0.3em; }
h2 { font-size: 1.3em; margin-top: 2em; border-bottom: 1px solid #ddd; padding-bottom: 0.3em; }

fetch('state-of-ehi-export.md').then(r=>r.text()).then(md=>{
  document.getElementById('content').innerHTML = marked.parse(md);
